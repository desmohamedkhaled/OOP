<body>
<header><div class="hi"><h1>Object-Oriented Analysis and Design (SET 211)</h1><p>Detailed notes for Lectures 1–6 with practice questions. Based on Dr. Mona Shouman’s slides.</p><div class="chips"><span>6 lectures</span><span>Diagrams</span><span>Worked traces</span><span>109 practice questions + tips</span></div></div></header>
<nav><div id="tabs" role="tablist" aria-label="Study sections"></div></nav>
<div class="search-box" id="search-box"><label for="site-search">Search lectures and questions</label><input id="site-search" class="search-input" type="search" placeholder="Search concepts, code, or answers..." autocomplete="off"><div id="search-results" class="search-results" role="status" aria-live="polite" hidden></div></div>
<main id="m"></main>
<button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" hidden>↑ Top</button>
<script>
const flow=a=>{const w=a.length*140;return `<svg viewBox="0 0 ${w} 60" role="img">${a.map((t,i)=>`<rect class="bx" x="${i*140+4}" y="10" width="112" height="40" rx="6"/><text x="${i*140+60}" y="35" text-anchor="middle">${t}</text>${i<a.length-1?`<text x="${i*140+128}" y="36" text-anchor="middle">→</text>`:""}`).join("")}</svg>`};
const tree=(p,k)=>{const w=k.length*150,c=w/2;return `<svg viewBox="0 0 ${w} 130" role="img"><rect class="bx" x="${c-60}" y="6" width="120" height="34" rx="6"/><text x="${c}" y="28" text-anchor="middle">${p}</text>${k.map((t,i)=>{const x=i*150+75;return `<path d="M${c} 40V60H${x}V80" fill="none" stroke="var(--ac)" stroke-width="1.5"/><rect class="bx" x="${x-65}" y="80" width="130" height="34" rx="6"/><text x="${x}" y="102" text-anchor="middle">${t}</text>`}).join("")}</svg>`};
const row=a=>{let x=4;const s=a.map(([t,w])=>{const r=`<rect class="bx" x="${x}" y="8" width="${w}" height="40"/><text x="${x+w/2}" y="33" text-anchor="middle">${t}</text>`;x+=w;return r}).join("");return `<svg viewBox="0 0 ${x+4} 56" role="img">${s}</svg>`};
const L=[
["L1","C++ Basics, Operators, Loops, Arrays",[
["Worked traces",`<p><b>Reverse 12345</b> (while n != 0):</p><table><tr><th>Pass</th><th>n</th><th>n % 10</th><th>rev = rev*10 + digit</th></tr><tr><td>1</td><td>12345</td><td>5</td><td>5</td></tr><tr><td>2</td><td>1234</td><td>4</td><td>54</td></tr><tr><td>3</td><td>123</td><td>3</td><td>543</td></tr><tr><td>4</td><td>12</td><td>2</td><td>5432</td></tr><tr><td>5</td><td>1</td><td>1</td><td>54321</td></tr></table><p><b>Sum 1 to 5</b> with for: sum becomes 1, 3, 6, 10, 15. <b>Seconds to minutes</b>: 125 / 60 = 2 and 125 % 60 = 5, so 2 minutes and 5 seconds.</p>`],
["Diagram: from source code to a running program",`<p class="cap">C++ is compiled: the whole program is translated before it runs. An interpreter would skip the object-code step and execute line by line.</p>`+flow(["Source .cpp","Compiler","Object code","Executable","Run"])+`<p>Fix compile errors (missing <code>;</code>, wrong names) first; only an error-free program produces an executable.</p>`],
["What is C++ and how it runs",`<ul><li>General-purpose language, an extension of C, supports OOP and low-level memory control. Versions: C++11, 14, 17, 20, 23.</li><li><b>Compiler</b> (C, C++, Java): translates the whole program to machine code first, then you run the executable (fast). <b>Interpreter</b> (Python, PHP): runs line by line (slower, easier to debug).</li><li>Every statement ends with <code>;</code>. C++ is case-sensitive (<code>cout</code> ≠ <code>Cout</code>).</li></ul><pre><code>#include &lt;iostream&gt;   // I/O library
using namespace std;    // no std:: prefix
int main() {            // execution starts here
    cout &lt;&lt; "Hello World!";
    return 0;           // 0 = success
}</code></pre><ul><li><code>cout &lt;&lt;</code> prints, <code>cin &gt;&gt;</code> reads. <code>\\n</code> or <code>endl</code> = new line. Escapes: <code>\\t</code> tab, <code>\\\\</code> backslash, <code>\\"</code> quote.</li><li>Comments: <code>//</code> single line, <code>/* */</code> multi-line. Comment <i>why</i>, not <i>what</i>.</li></ul>`],
["Variables, types, naming",`<table><tr><th>Type</th><th>Holds</th></tr><tr><td>int</td><td>whole numbers</td></tr><tr><td>float / double</td><td>decimals (6–7 / about 15 digits)</td></tr><tr><td>char</td><td>one character <code>'A'</code></td></tr><tr><td>string</td><td>text (needs <code>#include &lt;string&gt;</code>)</td></tr><tr><td>bool</td><td>true / false</td></tr></table><p>Sizes: bool 1, char 1, float 4, double 8; the slide says int = 2 bytes, but it is usually 4 on modern compilers.</p><ul><li>Names: letters, digits, underscore; must <b>not</b> start with a digit; case-sensitive; no spaces or symbols; no keywords (<code>int</code>, <code>return</code>).</li><li>Integer division truncates: <code>125/60 = 2</code>; <code>%</code> is the remainder: <code>125%60 = 5</code>.</li><li><code>&lt;cmath&gt;</code>: <code>sqrt(64)=8</code>, <code>round(2.6)=3</code>, <code>pow(2,3)=8</code>, <code>abs(-5)=5</code>, <code>log(2)=0.693</code>.</li></ul>`],
["Operators",`<ul><li><b>Arithmetic</b> <code>+ - * / % ++ --</code>; <b>assignment</b> <code>= += -= *= /= %=</code>; <b>comparison</b> <code>== != &gt; &lt; &gt;= &lt;=</code>; <b>logical</b> <code>&amp;&amp; || !</code>.</li><li><code>i++</code> uses the old value then increments; <code>++i</code> increments first.</li></ul><pre><code>int i = 5;
int a = i++;  // a=5, i=6
int b = ++i;  // i=7, b=7</code></pre><ul><li>Bitwise: <code>6 &amp; 3 = 2</code>; shifting left by 1 doubles, right by 1 halves.</li><li>Classic bug: <code>=</code> assigns, <code>==</code> compares.</li></ul>`],
["Selection: if, ternary, switch",`<pre><code>if (time &lt; 10) cout &lt;&lt; "Good morning.";
else if (time &lt; 20) cout &lt;&lt; "Good day.";
else cout &lt;&lt; "Good evening.";
string r = (time &lt; 18) ? "Good day." : "Good evening.";</code></pre><ul><li>Two separate <code>if</code>s can both run (input 10 prints HiFive and HiEven).</li><li><code>switch</code> compares one int/char against fixed cases. <b>Without <code>break</code> execution falls through</b> to the next case; <code>default</code> runs when nothing matches.</li></ul>`],
["Loops, break, continue",`<ul><li><code>while</code>: checks the condition <b>before</b> each pass (may run 0 times). Forgetting to change the variable gives an infinite loop.</li><li><code>do { } while (cond);</code>: runs <b>at least once</b>; used for menus and input validation.</li><li><code>for (init; cond; update)</code>: use when the count is known.</li><li><code>break</code> exits the loop; <code>continue</code> skips to the next iteration. Nested loops: outer 2 × inner 3 = 6 executions.</li></ul><pre><code>// reverse a number
int n = 12345, rev = 0;
while (n) { rev = rev*10 + n%10; n /= 10; }  // rev = 54321</code></pre><div class="tip"><code>% 10</code> takes the last digit, <code>* 10</code> shifts the result left, <code>/ 10</code> removes the last digit.</div>`],
["Arrays",`<ul><li>Same-type values in one variable; zero-indexed: first <code>[0]</code>, last <code>[size-1]</code>.</li><li><code>string cars[4] = {"Volvo","BMW","Ford","Mazda"}; cars[0] = "BMW";</code></li><li>Traverse with <code>for (int i=0;i&lt;5;i++)</code>. 2D arrays: <code>letters[row][col]</code> with nested loops (outer = rows).</li></ul>`]]],
["L2","Functions",[
["Function basics",`<p>A function has its own input, processing, output; it gives reusability and cleaner code.</p><pre><code>int addition(int a, int b) { int r = a + b; return r; }
int main() { int z = addition(5, 3); cout &lt;&lt; z; }  // 8</code></pre><ul><li>Return type must match the returned value; <code>void</code> means nothing is returned.</li><li>A call can sit inside an expression: <code>4 + subtraction(5,3)</code>.</li></ul>`],
["Scope",`<ul><li><b>Local</b>: inside a function/block only; destroyed when it ends. Using it from another function is a compile error.</li><li><b>Global</b>: outside all functions, visible everywhere.</li><li><b>Static local</b> (L5): keeps its value between calls; initialized once.</li></ul>`],
["Worked traces",`<p><b>power(2,3)</b>: result = 1, then 2, 4, 8 (loop runs 3 times).</p><p><b>swap(x,y)</b> with x=10, y=20 by reference:</p><table><tr><th>Step</th><th>a (x)</th><th>b (y)</th><th>temp</th></tr><tr><td>start</td><td>10</td><td>20</td><td>-</td></tr><tr><td>temp = a</td><td>10</td><td>20</td><td>10</td></tr><tr><td>a = b</td><td>20</td><td>20</td><td>10</td></tr><tr><td>b = temp</td><td>20</td><td>10</td><td>10</td></tr></table><p><b>Overload choice</b>: operate(5,2) picks the int version (10); operate(5.0f,2.0f) picks the float version (2.5). <b>Defaults</b>: addBonus(s1) adds 10, addBonus(s2,15) adds 15.</p>`],
["Diagram: by value vs by reference",`<svg viewBox="0 0 560 100" role="img"><text x="10" y="16">By value: f(x)</text><rect class="bx" x="10" y="26" width="90" height="36"/><text x="55" y="49" text-anchor="middle">x = 5</text><rect class="bx" x="150" y="26" width="110" height="36"/><text x="205" y="49" text-anchor="middle">a = 5 (copy)</text><text x="10" y="84">a = 100 changes only the copy</text><text x="300" y="16">By reference: f(int&amp; a)</text><rect class="bx" x="300" y="26" width="160" height="36"/><text x="380" y="49" text-anchor="middle">x and a: same 5</text><text x="300" y="84">a = 100 changes x too</text></svg>`],
["Pass by value vs by reference",`<ul><li><b>By value</b> <code>void f(int a)</code>: copy; original unchanged.</li><li><b>By reference</b> <code>void f(int&amp; a)</code>: alias of the original; changes stick.</li></ul><pre><code>void swap(int&amp; a, int&amp; b){ int t=a; a=b; b=t; }
void prevnext(int x,int&amp; prev,int&amp; next){ prev=x-1; next=x+1; }</code></pre><p>References let one function “return” several values.</p>`],
["Default values and overloading",`<ul><li>Defaults go on the <b>rightmost</b> parameters: <code>int divide(int a, int b=2)</code>; <code>divide(12)=6</code>, <code>divide(20,4)=5</code>.</li><li><b>Overloading</b>: same name, different parameter count or types (compile-time polymorphism). Differing <b>only by return type is an error</b>.</li></ul><pre><code>int   operate(int a,int b){return a*b;}      // operate(5,2)=10
float operate(float a,float b){return a/b;}  // operate(5.0f,2.0f)=2.5</code></pre>`],
["Prototypes",`<p>A function must be declared before use. A prototype (<code>void odd(int a);</code>) promises the function exists, so you can define it after <code>main</code>. It also allows <b>mutual recursion</b>: <code>odd()</code> calls <code>even()</code> and back.</p><p>Examples to know: factorial (<code>5!=120</code>, <code>0!=1</code>), power, getGrade (90/80/70/60), sumDigits, isEven (<code>n%2==0</code>), <code>addBonus(int&amp; score,int bonus=10)</code>.</p>`]]],
["L3","Pointers and Structures",[
["Worked trace: two pointers, one variable",`<table><tr><th>Statement</th><th>firstvalue</th><th>secondvalue</th><th>p1 points to</th></tr><tr><td>start</td><td>5</td><td>15</td><td>firstvalue</td></tr><tr><td>*p1 = 10;</td><td>10</td><td>15</td><td>firstvalue</td></tr><tr><td>*p2 = *p1;</td><td>10</td><td>10</td><td>firstvalue</td></tr><tr><td>p1 = p2;</td><td>10</td><td>10</td><td>secondvalue</td></tr><tr><td>*p1 = 20;</td><td>10</td><td>20</td><td>secondvalue</td></tr></table><div class="tip">p2 points to secondvalue the whole time. Copying a pointer copies the address; copying *p copies the value.</div>`],
["Diagram: a pointer holds an address",`<svg viewBox="0 0 420 90" role="img"><rect class="bx" x="10" y="20" width="110" height="40"/><text x="65" y="45" text-anchor="middle">num = 25</text><text x="65" y="78" text-anchor="middle">address 0x4a00</text><rect class="bx" x="270" y="20" width="130" height="40"/><text x="335" y="45" text-anchor="middle">p = 0x4a00</text><path d="M270 40H134" stroke="var(--ac)" stroke-width="2"/><path d="M122 40l10-6v12z" fill="var(--ac)"/><text x="335" y="78" text-anchor="middle">int *p = &amp;num;</text></svg><p><code>p</code> shows the address 0x4a00, <code>*p</code> shows 25, and <code>*p = 20;</code> changes <code>num</code>.</p>`],
["Pointers",`<ul><li><code>&amp;x</code> = address of x; a <b>pointer</b> stores an address: <code>int *p = &amp;num;</code>. <code>*p</code> = value at that address.</li><li>Types must match: <code>float c; int *p = &amp;c;</code> is an error.</li></ul><pre><code>int *p = &amp;num;  cout &lt;&lt; p;   // address
cout &lt;&lt; *p;  *p = 20;     // value / write through pointer
p1 = p2;      // copies ADDRESS
*p1 = *p2;    // copies VALUE</code></pre><ul><li>Initialize with <code>nullptr</code> (preferred), <code>&amp;var</code>, or an array name.</li></ul>`],
["Pointer bugs",`<ul><li>Uninitialized pointer (<code>int *p; *p=12;</code>) writes to a random address, crash.</li><li>Copying a garbage pointer spreads the garbage.</li><li>Dereferencing <code>nullptr</code> gives a segfault; check <code>if (p != nullptr)</code>.</li></ul>`],
["Pointers and arrays",`<ul><li>An array is not a pointer. In most expressions its name converts to a pointer to element 0; the array itself cannot be reassigned, so <code>vals = vals + 1;</code> is illegal, while a separate pointer such as <code>valptr = valptr + 1;</code> can move.</li><li><code>vals[i] == *(vals+i)</code>. <code>p++</code> moves to the next element.</li></ul><pre><code>int size; cin &gt;&gt; size;
int* arr = new int[size];     // heap array
for (int i=0;i&lt;size;i++) cin &gt;&gt; arr[i];
delete[] arr;                 // brackets required</code></pre>`],
["Diagram: structure memory layout",`<p class="cap">inv_type: members sit one after another (40 + 8 + 8 + 4 + 4 = 64 bytes).</p>`+row([["item (40 B)",250],["cost 8",90],["retail 8",90],["on_hand 4",90],["load_time 4",100]])+`<p><code>x</code> and <code>y</code> of type inv_type each own a separate 64-byte block, so changing <code>x.cost</code> never affects <code>y.cost</code>.</p>`],
["Structures",`<ul><li>A <code>struct</code> groups members of <b>different types</b>; the closing <code>};</code> semicolon is mandatory; declaring it allocates no memory until you define a variable.</li><li>Dot <code>.</code> for variables, arrow <code>-&gt;</code> for pointers: <code>ptr-&gt;name == (*ptr).name</code>.</li><li>Members are contiguous; size ≈ sum of members (<code>inv_type</code> = 64 bytes), maybe plus padding; use <code>sizeof</code>.</li><li><code>b = a;</code> copies all members (independent copies; shallow if pointers inside).</li></ul><pre><code>struct Person { string name; int age; };
Person john = {"John", 25};
Person students[3];  students[i].name = "Ali";</code></pre>`],
["Structs with functions, nesting",`<ul><li>Pass by value (copy), by reference <code>&amp;</code> (modifies original, efficient), by <code>const &amp;</code> (efficient and read-only); a function can return a struct.</li><li><b>Nested</b>: define the inner struct first; access with chained dots <code>e1.emp_address.city</code>, <code>s.dob.year</code>; initialize with nested braces.</li><li>Arrays inside structs: <code>s.grades[0] = 90;</code></li></ul>`]]],
["L4","Introduction to OOP",[
["Paradigms",`<ul><li><b>Imperative</b> (tell the machine <i>how</i>): procedural/structured and object-oriented.</li><li><b>Declarative</b> (declare the <i>result</i>): functional, logic, mathematical.</li><li>A language can belong to several paradigms.</li></ul>`],
["Structured programming",`<ul><li>Data and operations are separate; the <b>function</b> is the main unit. Built from block, selection, iteration, nesting; top-down design.</li><li><b>Pros</b>: readable, maintainable, debuggable. <b>Cons</b>: hard to reuse (depends on globals/headers), poor mapping to real-life problems, complexity explodes in large projects, so OOP was created.</li></ul>`],
["Without OOP vs with OOP",`<pre><code>// Without OOP: scattered data
string names[100]; int ids[100]; double gpas[100];
dropObject(ids[i], subject);

// With OOP: one class bundles everything
Student s1("Ahmed", 1001, 3.8);
s1.dropSubject("CS201");</code></pre><p>Adding a student means creating one object instead of updating every array.</p>`],
["Diagram: one class, many objects",`<p class="cap">The class is the blueprint; every object has its own data but shares the methods.</p>`+tree("class Student",["Ali: GPA 3.8","Sara: GPA 2.9","John: GPA 3.5"])],
["OOP and its building blocks",`<ul><li>OOP bundles data and operations in one structure; the <b>class</b> is the main unit; objects communicate by sending messages (method calls). First step: data modeling.</li><li><b>Class</b> = blueprint; <b>Attributes</b> = what it has (state); <b>Methods</b> = what it does; <b>Object</b> = an instance with its own data.</li></ul><div class="tip">Design rule: “what does it have?” gives attributes; “what can it do?” gives methods. Keep attributes private.</div><table><tr><th></th><th>Structured</th><th>OOP</th></tr><tr><td>Focus</td><td>functions</td><td>objects/classes</td></tr><tr><td>Data</td><td>separate</td><td>bundled</td></tr><tr><td>Reuse</td><td>limited</td><td>high (inheritance)</td></tr><tr><td>Security</td><td>globally accessible</td><td>hidden (encapsulation)</td></tr><tr><td>Scale</td><td>breaks down</td><td>scales well</td></tr></table>`],
["Benefits and examples",`<ul><li>Ease of design (think in the problem space), ease of maintenance (changes are isolated), reusable tested classes.</li><li>Examples: Student, Professor, Soccer game (Player, Ball, Referee, ScoreBoard), Hospital system (Medical staff: Doctor, Nurse; Non-medical: HR, IT, Front desk).</li></ul>`]]],
["L5","Pillars of OOP, Classes and Objects",[
["Scope and ::",`<ul><li>Local, global, and <code>static</code> (keeps value between calls).</li><li>Scope operator reaches the global when a local hides it:</li></ul><pre><code>int x = 50;
int main(){ int x = 10; cout &lt;&lt; x &lt;&lt; ::x; }  // 10 then 50</code></pre>`],
["Worked trace: Vector offset",`<table><tr><th>Step</th><th>start</th><th>end</th></tr><tr><td>set values</td><td>(2,3)</td><td>(4,6)</td></tr><tr><td>offset(1,2)</td><td>(3,5)</td><td>(5,8)</td></tr></table><p>Printed twice: <code>(2,3) -&gt; (4,6)</code> then <code>(3,5) -&gt; (5,8)</code>. One method call moved both points.</p>`],
["Diagrams: pillars and inheritance",tree("OOP pillars",["Encapsulation","Abstraction","Inheritance","Polymorphism"])+`<p class="cap">Inheritance: Male and Female get Walk(), Talk(), See(), Eat() from HumanBeing.</p>`+tree("HumanBeing",["Male","Female"])],
["The four pillars",`<ul><li><b>Inheritance</b>: child (derived) class gets the parent’s (base) members: code reuse, logical hierarchy, easy maintenance.</li><li><b>Abstraction</b>: hide the <i>how</i>, show the <i>what</i> (you call <code>rect.area()</code> without knowing the formula).</li><li><b>Encapsulation</b>: bind data and methods in a class and hide data. <code>public</code> anywhere; <code>private</code> only inside the class; <code>protected</code> class and derived classes.</li><li><b>Polymorphism</b>: one interface, many forms. Compile-time = overloading; run-time = virtual functions.</li></ul>`],
["Classes and objects",`<ul><li>A class is an expanded struct (data <b>and</b> functions). Class = type, object = variable (<code>Student paul;</code>). Objects have their own data but share methods.</li><li>Class members are <b>private by default</b> (struct: public). Semicolon after <code>}</code> is mandatory.</li></ul><pre><code>class CRectangle {
    int x, y;                 // private
public:
    void set_values(int a,int b){ x=a; y=b; }
    int area(){ return x*y; }
};
CRectangle rect; rect.set_values(3,4);
cout &lt;&lt; rect.area();         // 12</code></pre>`],
["Nested classes, methods, passing objects",`<ul><li>Nested: <code>class Vector { public: Point start, end; };</code> access <code>vec.start.x</code>. <code>vec2 = vec1;</code> copies all fields.</li><li>Pass an object by value = copy (changes lost); by reference = original changes.</li><li>Methods see the fields directly: <code>offset(dx,dy){ start.x+=dx; end.x+=dx; start.y+=dy; end.y+=dy; }</code>. Start (2,3), end (4,6), <code>offset(1,2)</code> gives (3,5) to (5,8).</li><li>Dynamic array of structs: <code>Product *c = new Product[3]; (c+i)-&gt;name; delete[] c;</code></li></ul>`]]],
["L6","Constructors and Destructors",[
["Constructors",`<ul><li>Special function called during object initialization; same name as the class; <b>no return type</b> (not even void). Constructors are not inherited automatically; C++11 and later can inherit them explicitly with <code>using Base::Base;</code>. A constructor is not called like an ordinary member function on an existing object.</li></ul><pre><code>class CRectangle { int width, height;
public: CRectangle(int a,int b);
        int area(){ return width*height; } };
CRectangle::CRectangle(int a,int b){ width=a; height=b; }
CRectangle rect(3,4);   // area 12</code></pre>`],
["Default constructor and overloading",`<ul><li>No constructor written: compiler gives a default one. Write <b>any</b> constructor: it disappears; define both if you need both.</li><li>Write <code>CRectangle rectb;</code>, not <code>CRectangle rectb();</code> (that declares a function).</li><li>Constructors can be overloaded and have defaults: <code>Circle(double r=1.0, string c="red")</code>; <code>Circle c3;</code> gives radius 1, red.</li><li>Types: default, parameterized, copy <code>A(const A&amp; obj)</code>.</li></ul>`],
["Worked traces",`<table><tr><th>BankAccount step</th><th>balance</th></tr><tr><td>BankAccount("Alice",1000)</td><td>1000</td></tr><tr><td>deposit(500)</td><td>1500</td></tr><tr><td>withdraw(200)</td><td>1300</td></tr></table><p>At the end of main the destructor prints <code>Account closed for Alice</code>.</p><table><tr><th>Employee call</th><th>Result</th></tr><tr><td>e.calculatetax() with salary 4800</td><td>240</td></tr><tr><td>e1.calculatetax() with salary 50000</td><td>2500</td></tr><tr><td>e1.calculatetax(6000)</td><td>300</td></tr><tr><td>e1.calculatetax(7000)</td><td>350</td></tr></table>`],
["Diagrams: object lifecycle",`<p class="cap">Create, use, destroy. Constructor and destructor run automatically.</p>`+flow(["Object created","Constructor","Use methods","Destructor","Memory freed"])+`<p class="cap">Marks m1; Marks m2; are destroyed in reverse order (LIFO).</p>`+flow(["Create m1","Create m2","Destroy m2","Destroy m1"])],
["Destructors",`<ul><li><code>~ClassName()</code>; no parameters, no return, <b>only one</b> per class. Runs when a local object’s scope ends, when <code>delete</code> is used, or at program end (globals).</li><li>Must release resources owned by the object (for example, <code>delete[]</code> memory allocated with <code>new[]</code>) to avoid leaks.</li><li>Several objects are destroyed in <b>reverse order</b> (LIFO): <code>Marks m1; Marks m2;</code> destroys m2 then m1.</li></ul>`],
["Default arguments (rules)",`<ul><li>Specified in the <b>prototype only</b>, not repeated in the definition.</li><li>Only on rightmost parameters; required parameters come first.</li></ul><p><code>int sum(int n1,int n2,int n3=0,int n4=0,int n5=0);</code> <code>sum(1,1)=2</code>; <code>sum(1)</code> is an error.</p>`],
["Encapsulation, getters and setters",`<ul><li>Keep data <code>private</code>; expose public functions. Golden rule: do not make data public without a very good reason.</li><li><b>Getter</b> <code>getXxx()</code> reads without modifying. <b>Setter</b> <code>setXxx()</code> validates before changing.</li></ul><pre><code>void setRadius(double r){ if (r &gt; 0) radius = r; else cout &lt;&lt; "Invalid radius!"; }</code></pre>`],
["Common mistakes",`<ul><li><code>rect.CRectangle(3,4);</code> (explicit call), <code>void CRectangle(...)</code> (return type), <code>CRectangle r();</code>, missing <code>delete</code>, uninitialized members, trying to overload the destructor, missing <code>;</code> after a class.</li></ul>`]]]];

  const saved=card.dataset.question?progress[card.dataset.question]:null;
  const isWrong=card.dataset.category==="mcq"&&saved&&saved.correct===false;
  const showLecture=lecture==="all"||card.dataset.lecture===lecture;
  const showWrong=!reviewWrongOnly||(activePanel.id==="question-panel-mcq"&&isWrong);
  card.hidden=!(showLecture&&showWrong);
  if(!card.hidden)visible++;
 });
 activePanel?.querySelectorAll(".lh[data-lecture-heading]").forEach(heading=>{
  const hasVisibleQuestion=[...activePanel.querySelectorAll(`.q[data-lecture="${heading.dataset.lecture}"]`)].some(card=>!card.hidden);
  heading.hidden=!hasVisibleQuestion;
 });
 const empty=activePanel?.querySelector(".filter-empty");
 if(empty)empty.hidden=visible!==0;
 const status=document.getElementById("filter-status");
 if(reviewWrongOnly&&activePanel.id==="question-panel-mcq")status.textContent=`Showing ${visible} question${visible===1?"":"s"} answered incorrectly and available to retry.`;
 else if(lecture!=="all"&&cards.length)status.textContent=`Showing ${visible} question${visible===1?"":"s"} from Lecture ${lecture[1]}.`;
 else status.textContent="";
};
document.getElementById("lecture-filter").addEventListener("change",refreshQuestionFilter);
document.getElementById("review-wrong").addEventListener("click",e=>{
 reviewWrongOnly=!reviewWrongOnly;
 e.currentTarget.setAttribute("aria-pressed",String(reviewWrongOnly));
 e.currentTarget.textContent=reviewWrongOnly?"Show all questions":"Review wrong answers";
 if(reviewWrongOnly)document.getElementById("question-tab-mcq").click();
 refreshQuestionFilter();
});
document.getElementById("sc").textContent=score+" / "+M.length;
refreshQuestionFilter();
m.addEventListener("click",e=>{
 if(e.target.closest(".question-tab"))return;
 if(e.target.closest("#reset-quiz")){progress={};score=0;document.getElementById("sc").textContent="0 / "+M.length;document.querySelectorAll(".q[data-question]").forEach(q=>{delete q.dataset.done;q.querySelectorAll(".o").forEach(o=>{o.disabled=false;o.classList.remove("ok","no");o.setAttribute("aria-pressed","false")});q.querySelector(".ex").textContent=MCQ_EXPLANATIONS[+q.dataset.question-1];q.querySelector(".ex").classList.remove("on","wrong")});reviewWrongOnly=false;document.getElementById("review-wrong").setAttribute("aria-pressed","false");document.getElementById("review-wrong").textContent="Review wrong answers";refreshQuestionFilter();saveProgress();return}
 const o=e.target.closest(".o");
 if(o){const q=o.closest(".q");if(q.dataset.done)return;const question=q.dataset.question,choice=+o.dataset.j,a=+q.dataset.a;
  q.querySelectorAll(".o").forEach(x=>{x.classList.remove("no");x.setAttribute("aria-pressed","false")});q.querySelector(".ex").classList.remove("wrong");
  o.setAttribute("aria-pressed","true");
  if(choice===a){score++;q.dataset.done="true";q.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(+x.dataset.j===a)x.classList.add("ok")});q.querySelector(".ex").textContent=MCQ_EXPLANATIONS[+question-1];q.querySelector(".ex").classList.add("on");progress[question]={choice,correct:true};document.getElementById("sc").textContent=score+" / "+M.length}
  else{o.classList.add("no");q.querySelector(".ex").classList.add("wrong");q.querySelector(".ex").textContent="Not quite. Try another answer.";progress[question]={choice,correct:false}}
  saveProgress();refreshQuestionFilter();return}
 const s=e.target.closest(".sh");if(s&&s.dataset.all){const d=[...s.parentElement.querySelectorAll("details")],open=d.some(x=>!x.open);d.forEach(x=>x.open=open);s.setAttribute("aria-pressed",String(open))}
 else if(s&&s.nextElementSibling&&s.nextElementSibling.classList.contains("ex")){const revealed=s.nextElementSibling.classList.toggle("on");s.setAttribute("aria-expanded",String(revealed))}
});
const searchInput=document.getElementById("site-search");
const searchResults=document.getElementById("search-results");
const searchSummary=document.getElementById("search-summary");
searchInput.addEventListener("input",()=>{
 const query=searchInput.value.trim().toLocaleLowerCase();
 searchResults.replaceChildren();
 if(query.length<2){searchResults.hidden=true;searchSummary.textContent="";return}
 const matches=[];
 document.querySelectorAll("section[id^='s-L'] details").forEach(detail=>{
  if(detail.innerText.toLocaleLowerCase().includes(query))matches.push({target:detail,title:detail.querySelector("summary")?.innerText||"Lecture notes",category:"Lecture notes"});
 });
 document.querySelectorAll(".q[data-lecture]").forEach(card=>{
  if(card.innerText.toLocaleLowerCase().includes(query))matches.push({target:card,title:card.querySelector("p")?.innerText||"Practice question",category:`Lecture ${card.dataset.lecture[1]} · ${card.dataset.category}`});
 });
 const shown=matches.slice(0,30);
 searchSummary.textContent=`${matches.length} result${matches.length===1?"":"s"} for “${searchInput.value.trim()}”${matches.length>30?" (showing the first 30)":""}.`;
 if(!shown.length){searchResults.textContent="No matching notes or questions.";searchResults.hidden=false;return}
 shown.forEach(match=>{
  const button=document.createElement("button");
  button.type="button";button.className="search-result";button.dataset.target=match.target.id;
  button.textContent=(match.title||"").replace(/\s+/g," ").slice(0,150);
  const small=document.createElement("small");small.textContent=match.category;button.append(small);
  searchResults.append(button);
 });
 searchResults.hidden=false;
});
searchResults.addEventListener("click",e=>{
 const button=e.target.closest(".search-result");if(!button)return;
 const target=document.getElementById(button.dataset.target);if(!target)return;
 const section=target.closest("section");
 if(target.matches("details"))target.open=true;
 if(target.matches(".q")){
  document.getElementById("lecture-filter").value="all";
  reviewWrongOnly=false;
  document.getElementById("review-wrong").setAttribute("aria-pressed","false");
  document.getElementById("review-wrong").textContent="Review wrong answers";
  const category=target.dataset.category;
  if(category)document.getElementById(`question-tab-${category}`).click();
  refreshQuestionFilter();
 }
 location.hash=section.id.slice(2).toLowerCase();
 searchResults.hidden=true;
 setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"start"}),100);
});
const mockPanel=document.getElementById("question-panel-mock");
const mockStage=document.getElementById("mock-stage");
let mockQuestions=[];
let mockAnswers=[];
let mockSubmitted=false;
mockPanel.addEventListener("click",e=>{
 if(e.target.closest("#mock-start")){
  const count=Number(document.getElementById("mock-count").value);
  if(!Number.isInteger(count)||count<1||count>M.length){console.error("Invalid mock exam question count.");return}
  const shuffled=Array.from({length:M.length},(_,i)=>i);
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
  mockQuestions=shuffled.slice(0,count);
  mockAnswers=Array(count).fill(null);mockSubmitted=false;
  mockStage.innerHTML=mockQuestions.map((questionIndex,index)=>{
   const [text,options]=M[questionIndex];
   return `<div class="mock-question" data-mock-index="${index}"><h4>${index+1}. ${esc(text)}</h4>${options.map((option,choice)=>`<button class="mock-option" type="button" data-choice="${choice}" aria-pressed="false">${String.fromCharCode(65+choice)}. ${esc(option)}</button>`).join("")}<div class="ex" id="mock-explanation-${index}"></div></div>`;
  }).join("")+`<p id="mock-feedback" role="status" aria-live="polite"></p><button id="mock-submit" class="sh" type="button">Submit exam</button><div id="mock-results"></div>`;
  mockStage.querySelector(".mock-option")?.focus();
  return;
 }
 const option=e.target.closest(".mock-option");
 if(option&&!mockSubmitted){
  const question=option.closest(".mock-question"),index=+question.dataset.mockIndex;
  mockAnswers[index]=+option.dataset.choice;
  question.querySelectorAll(".mock-option").forEach(button=>button.setAttribute("aria-pressed",String(button===option)));
  document.getElementById("mock-feedback").textContent="";
  return;
 }
 if(e.target.closest("#mock-submit")&&!mockSubmitted){
  if(mockAnswers.some(answer=>answer===null)){document.getElementById("mock-feedback").textContent="Answer every question before submitting.";return}
  mockSubmitted=true;
  let correctCount=0;
  mockQuestions.forEach((questionIndex,index)=>{
   const [,options,answer]=M[questionIndex],question=mockStage.querySelector(`[data-mock-index="${index}"]`);
   const correct=mockAnswers[index]===answer;if(correct)correctCount++;
   question.querySelectorAll(".mock-option").forEach((button,choice)=>{button.disabled=true;if(choice===answer)button.classList.add("correct");else if(choice===mockAnswers[index])button.classList.add("incorrect")});
   const explanation=question.querySelector(".ex");
   explanation.textContent=`${correct?"Correct. ":"Incorrect. Correct answer: "+String.fromCharCode(65+answer)+". "+options[answer]+". "}${MCQ_EXPLANATIONS[questionIndex]}`;
   explanation.classList.add("on");
  });
  document.getElementById("mock-feedback").textContent=`Exam complete: ${correctCount} / ${mockQuestions.length} correct (${Math.round(correctCount/mockQuestions.length*100)}%).`;
  document.getElementById("mock-results").innerHTML=`<div class="mock-results"><h4>Answer review</h4><p>Correct: ${correctCount} · Incorrect: ${mockQuestions.length-correctCount}</p><button id="mock-start-again" class="sh" type="button">Start another exam</button></div>`;
  return;
 }
 if(e.target.closest("#mock-start-again"))document.getElementById("mock-start").click();
});
const backToTop=document.getElementById("back-to-top");
addEventListener("scroll",()=>{backToTop.hidden=scrollY<400},{passive:true});
backToTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("hashchange",show);show();
